[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
rand = "0.10.4"
rand_chacha = "0.10.0"
clap = { version = "4.6.9", features = ["derive"] }
proptest = "1.12.0"
types = { path = "crates/types" }
book = { path = "crates/book" }
exchange = { path = "crates/exchange" }
venue = { path = "crates/venue" }
strategy = { path = "crates/strategy" }
risk = { path = "crates/risk" }

[profile.release]
opt-level = 3
lto = "fat"          # whole-program optimization
codegen-units = 1    # better optimization, slower build
panic = "abort"      # no unwinding machinery
debug = true         # keep symbols for profiling
